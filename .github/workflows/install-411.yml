name: Install Infinity Castle Elements 4.1.1

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap411/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'trigger 4.1.1 installer')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild release archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap411/part* | base64 --decode > /tmp/ice411.zip
          unzip -t /tmp/ice411.zip
          rm -rf /tmp/ice411
          mkdir -p /tmp/ice411
          unzip -q -o /tmp/ice411.zip -d /tmp/ice411
          SRC="$(find /tmp/ice411 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Install 4.1.1 source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete             --exclude='.git/'             --exclude='.github/'             --exclude='.bootstrap411/'             "$SRC"/ ./
          rm -rf .bootstrap411

      - name: Verify source before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node --check public/game.js
          node --check tools/audit-levels.js
          npm install
          npm run test:levels

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "release: Infinity Castle Elements 4.1.1 insanity fixed"
          git push origin HEAD:main
