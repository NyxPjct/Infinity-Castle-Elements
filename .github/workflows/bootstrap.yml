name: Install Terra & Ar 3.3

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/terra-ar-release
          cat .bootstrap/part* | base64 --decode > /tmp/terra-ar-release.zip
          unzip -q -o /tmp/terra-ar-release.zip -d /tmp/terra-ar-release

      - name: Install release into repository
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete             --exclude='.git/'             --exclude='.bootstrap/'             --exclude='.github/workflows/bootstrap.yml'             --exclude='.github/workflows/audit.yml'             /tmp/terra-ar-release/ ./
          rm -rf .bootstrap

      - name: Commit Terra & Ar 3.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "release: Terra & Ar 3.3 audited"
          git push origin HEAD:main
