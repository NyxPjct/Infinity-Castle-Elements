name: Audit 1000 Levels

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/game.js
          node --check tools/audit-levels.js
          node --check tools/test-chaos-multiplayer.js

      - name: Audit all 1000 levels
        run: npm run test:levels

      - name: Test four-player Chaos multiplayer
        run: npm run test:chaos
