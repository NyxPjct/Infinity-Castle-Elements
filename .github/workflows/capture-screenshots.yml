name: Capture game screenshots

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/capture-screenshots.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project and browser
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local game server
        run: |
          node server.js > /tmp/ice-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ice-server.log
          exit 1

      - name: Capture real game screenshots
        run: |
          cat > /tmp/capture.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const BASE = 'http://127.0.0.1:3000';
          const OUT = path.resolve('docs/images');
          fs.mkdirSync(OUT, { recursive: true });
          const socketClient = fs.readFileSync(require.resolve('socket.io-client/dist/socket.io.min.js'), 'utf8');

          async function wire(page) {
            await page.route('**/socket.io.min.js', route =>
              route.fulfill({ status: 200, contentType: 'application/javascript', body: socketClient })
            );
            await page.addInitScript(() => {
              window.ICE_MULTIPLAYER_SERVER_URL = 'http://127.0.0.1:3000';
            });
            await page.goto(BASE, { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => typeof window.showMainMenu === 'function' || document.querySelector('#menuSingleBtn'));
            await page.evaluate(() => {
              try { showMainMenu(); } catch {}
            });
            await page.waitForSelector('#mainMenu:not(.hidden)', { timeout: 10000 });
          }

          async function selectElement(page, element) {
            await page.click(`.character-choice[data-element="${element}"]`);
          }

          async function startSolo(page, element='earth') {
            await page.click('#menuSingleBtn');
            await page.waitForSelector('#lobby:not(.hidden)');
            await selectElement(page, element);
            await page.click('#soloBtn');
            await page.waitForSelector('#gameWrap:not(.hidden)', { timeout: 10000 });
            await page.waitForTimeout(1200);
          }

          async function openMode(page, mode, element, name) {
            if (mode === 'multiplayer') {
              await page.click('#menuMultiBtn');
              await page.waitForSelector('#multiSetup:not(.hidden)');
              await selectElement(page, element);
              await page.fill('#playerName', name);
            } else {
              await page.click('#menuChaosBtn');
              await page.waitForSelector('#chaosSetup:not(.hidden)');
              await selectElement(page, element);
              await page.fill('#chaosPlayerName', name);
            }
          }

          async function createRoom(page, mode) {
            await page.click(mode === 'multiplayer' ? '#createBtn' : '#createChaosBtn');
            await page.waitForSelector('#room:not(.hidden)', { timeout: 10000 });
            const code = (await page.textContent('#roomCode')).trim();
            if (!code || code === '------') throw new Error('Room code was not created');
            return code;
          }

          async function joinRoom(page, mode, code) {
            const input = mode === 'multiplayer' ? '#roomCodeInput' : '#chaosRoomCodeInput';
            const btn = mode === 'multiplayer' ? '#joinBtn' : '#joinChaosBtn';
            await page.fill(input, code);
            await page.click(btn);
            await page.waitForSelector('#room:not(.hidden)', { timeout: 10000 });
          }

          async function readyAll(pages) {
            for (const page of pages) await page.click('#readyBtn');
            for (const page of pages) await page.waitForSelector('#gameWrap:not(.hidden)', { timeout: 15000 });
            await pages[0].waitForTimeout(1500);
          }

          async function main() {
            const browser = await chromium.launch({ headless: true });

            const desktop = await browser.newContext({
              viewport: { width: 1600, height: 900 },
              deviceScaleFactor: 1
            });

            // Menu principal
            {
              const page = await desktop.newPage();
              await wire(page);
              await page.waitForTimeout(500);
              await page.screenshot({ path: path.join(OUT, 'menu-principal.png') });

              // Seleção de elementos
              await page.click('#menuSingleBtn');
              await page.waitForSelector('#lobby:not(.hidden)');
              await page.waitForTimeout(400);
              await page.screenshot({ path: path.join(OUT, 'selecao-elementos.png') });

              // Gameplay singleplayer
              await selectElement(page, 'darkness');
              await page.click('#soloBtn');
              await page.waitForSelector('#gameWrap:not(.hidden)', { timeout: 10000 });
              await page.waitForTimeout(1400);
              await page.keyboard.down('d');
              await page.waitForTimeout(450);
              await page.keyboard.up('d');
              await page.waitForTimeout(250);
              await page.screenshot({ path: path.join(OUT, 'gameplay-singleplayer.png') });
              await page.close();
            }

            // Multiplayer real: duas instâncias
            {
              const p1 = await desktop.newPage();
              const p2 = await desktop.newPage();
              await Promise.all([wire(p1), wire(p2)]);
              await openMode(p1, 'multiplayer', 'earth', 'Terra');
              await openMode(p2, 'multiplayer', 'air', 'Ar');
              const code = await createRoom(p1, 'multiplayer');
              await joinRoom(p2, 'multiplayer', code);
              await readyAll([p1, p2]);
              await p1.keyboard.down('d');
              await p1.waitForTimeout(500);
              await p1.keyboard.up('d');
              await p2.keyboard.down('d');
              await p2.waitForTimeout(700);
              await p2.keyboard.up('d');
              await p1.waitForTimeout(350);
              await p1.screenshot({ path: path.join(OUT, 'gameplay-multiplayer.png') });
              await p1.close();
              await p2.close();
            }

            // Modo Caos real: quatro instâncias, quatro elementos
            {
              const pages = [await desktop.newPage(), await desktop.newPage(), await desktop.newPage(), await desktop.newPage()];
              await Promise.all(pages.map(wire));
              const elements = ['earth', 'air', 'light', 'darkness'];
              const names = ['Terra', 'Ar', 'Luz', 'Escuridao'];
              for (let i = 0; i < 4; i++) await openMode(pages[i], 'chaos', elements[i], names[i]);
              const code = await createRoom(pages[0], 'chaos');
              for (let i = 1; i < 4; i++) await joinRoom(pages[i], 'chaos', code);
              await readyAll(pages);
              for (const p of pages) {
                await p.keyboard.down('d');
                await p.waitForTimeout(250);
                await p.keyboard.up('d');
              }
              await pages[0].waitForTimeout(400);
              await pages[0].screenshot({ path: path.join(OUT, 'modo-caos.png') });
              for (const p of pages) await p.close();
            }

            // Android / mobile horizontal, gameplay real
            {
              const mobile = await browser.newContext({
                viewport: { width: 844, height: 390 },
                deviceScaleFactor: 2,
                isMobile: true,
                hasTouch: true
              });
              const page = await mobile.newPage();
              await wire(page);
              await startSolo(page, 'light');
              await page.screenshot({ path: path.join(OUT, 'android-gameplay.png') });
              await page.close();
              await mobile.close();
            }

            await desktop.close();
            await browser.close();

            const expected = [
              'menu-principal.png',
              'selecao-elementos.png',
              'gameplay-singleplayer.png',
              'gameplay-multiplayer.png',
              'modo-caos.png',
              'android-gameplay.png'
            ];
            for (const f of expected) {
              const p = path.join(OUT, f);
              if (!fs.existsSync(p) || fs.statSync(p).size < 10000) {
                throw new Error(`Screenshot invalid: ${f}`);
              }
            }
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
          node /tmp/capture.cjs

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinity-castle-screenshots
          path: docs/images/*.png
          if-no-files-found: error

      - name: Commit screenshots
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/*.png
          if git diff --cached --quiet; then
            echo "No screenshot changes."
            exit 0
          fi
          git commit -m "docs: add real game screenshots"
          git push
