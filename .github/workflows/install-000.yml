name: Install Infinity Castle Elements 0.0

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap000/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild 0.0 source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap000/part* | base64 --decode > /tmp/ice000.zip
          unzip -t /tmp/ice000.zip
          rm -rf /tmp/ice000
          mkdir -p /tmp/ice000
          unzip -q -o /tmp/ice000.zip -d /tmp/ice000
          SRC="$(find /tmp/ice000 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Install definitive 0.0 source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete             --exclude='.git/'             --exclude='.github/'             --exclude='.bootstrap000/'             "$SRC"/ ./
          rm -rf .bootstrap000

      - name: Verify source before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node --check public/game.js
          node --check tools/audit-levels.js
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node tools/audit-levels.js

      - name: Commit definitive 0.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "release: Infinity Castle Elements INSANITY 0.0 desktop"
          git push origin HEAD:main
