name: Build Windows Desktop 0.0.0

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "public/**"
      - "build/**"
      - "server.js"
      - "package.json"
      - "README.md"
      - "COMO_JOGAR.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Audit all 1000 levels
        shell: pwsh
        run: npm run test:levels

      - name: Build Windows EXE
        shell: pwsh
        run: npm run dist:win -- --publish never

      - name: Create Windows package ZIP
        shell: pwsh
        run: |
          $setup = "dist/Infinity-Castle-Elements-Setup-0.0.exe"
          $portable = "dist/Infinity-Castle-Elements-Portable-0.0.exe"
          if (!(Test-Path $setup)) { throw "Setup EXE not found: $setup" }
          if (!(Test-Path $portable)) { throw "Portable EXE not found: $portable" }
          Compress-Archive -Path $setup,$portable -DestinationPath "dist/Infinity-Castle-Elements-Windows-0.0.zip" -Force

      - name: Show generated downloads
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -File | Where-Object { $_.Name -in @("Infinity-Castle-Elements-Setup-0.0.exe","Infinity-Castle-Elements-Portable-0.0.exe","Infinity-Castle-Elements-Windows-0.0.zip") } | Format-Table Name,Length

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Castle-Elements-Windows-0.0
          path: |
            dist/Infinity-Castle-Elements-Setup-0.0.exe
            dist/Infinity-Castle-Elements-Portable-0.0.exe
            dist/Infinity-Castle-Elements-Windows-0.0.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publish the three Windows downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.0"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Infinity Castle Elements — INSANITY 0.0.0" --notes "Versão desktop oficial INSANITY 0.0.0 da NYX PROJECT R para Windows. Escolha o instalador, a versão portable ou o pacote com os dois."
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "Infinity Castle Elements — INSANITY 0.0.0" --notes "Versão desktop oficial INSANITY 0.0.0 da NYX PROJECT R para Windows. Escolha o instalador, a versão portable ou o pacote com os dois."
          gh release upload $tag "dist/Infinity-Castle-Elements-Setup-0.0.exe" "dist/Infinity-Castle-Elements-Portable-0.0.exe" "dist/Infinity-Castle-Elements-Windows-0.0.zip" --repo $env:GITHUB_REPOSITORY --clobber
