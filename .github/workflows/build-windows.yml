name: Build Windows Desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "public/**"
      - "build/**"
      - "server.js"
      - "package.json"
      - "tools/**"
      - ".github/workflows/build-windows.yml"
      - "README.md"
      - "COMO_JOGAR.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Read package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if (-not $version) { throw "Could not read package version" }
          "ICE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building version $version"

      - name: Audit all 1000 levels
        shell: pwsh
        run: npm run test:levels

      - name: Test four-player Chaos multiplayer
        shell: pwsh
        run: npm run test:chaos

      - name: Build Windows EXE
        shell: pwsh
        run: npm run dist:win -- --publish never

      - name: Create Windows package ZIP
        shell: pwsh
        run: |
          $setup = "dist/Infinity-Castle-Elements-Setup-$env:ICE_VERSION.exe"
          $portable = "dist/Infinity-Castle-Elements-Portable-$env:ICE_VERSION.exe"
          $zip = "dist/Infinity-Castle-Elements-Windows-$env:ICE_VERSION.zip"
          if (!(Test-Path $setup)) { throw "Setup EXE not found: $setup" }
          if (!(Test-Path $portable)) { throw "Portable EXE not found: $portable" }
          Compress-Archive -Path $setup,$portable -DestinationPath $zip -Force

      - name: Show generated downloads
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -File | Where-Object { $_.Name -in @("Infinity-Castle-Elements-Setup-$env:ICE_VERSION.exe","Infinity-Castle-Elements-Portable-$env:ICE_VERSION.exe","Infinity-Castle-Elements-Windows-$env:ICE_VERSION.zip") } | Format-Table Name,Length

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Castle-Elements-Windows-${{ env.ICE_VERSION }}
          path: |
            dist/Infinity-Castle-Elements-Setup-${{ env.ICE_VERSION }}.exe
            dist/Infinity-Castle-Elements-Portable-${{ env.ICE_VERSION }}.exe
            dist/Infinity-Castle-Elements-Windows-${{ env.ICE_VERSION }}.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publish the three Windows downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:ICE_VERSION"
          $title = "Infinity Castle Elements — INSANITY $env:ICE_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "$title" --generate-notes
          } else {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "$title"
          }
          gh release upload $tag "dist/Infinity-Castle-Elements-Setup-$env:ICE_VERSION.exe" "dist/Infinity-Castle-Elements-Portable-$env:ICE_VERSION.exe" "dist/Infinity-Castle-Elements-Windows-$env:ICE_VERSION.zip" --repo $env:GITHUB_REPOSITORY --clobber
